# Power settings
# Sleep after 10 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
# Power off from the keyboard
CONFIG_ZMK_PM_SOFT_OFF=y

# Restrict allowed connections explicitly
# One connection for the peripheral part of the split and one for a host
CONFIG_BT_MAX_CONN=2
# Explicit restriction of the paired devices
CONFIG_BT_MAX_PAIRED=5

# Tweaks of BLE, currently only 2M PHY thing
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Allowing to use the keyboard to work within firmware via USB connection
CONFIG_ZMK_USB_BOOT=y

# Allowing to pass through the peripheral battery values
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
