# Power settings
# Sleep after 10 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
# Power off from the keyboard
CONFIG_ZMK_PM_SOFT_OFF=y

# Restrict allowed connections explicitly
# One connection, central part only
CONFIG_BT_MAX_CONN=1
# Explicit restriction of paired devices, central part only
CONFIG_BT_MAX_PAIRED=1
